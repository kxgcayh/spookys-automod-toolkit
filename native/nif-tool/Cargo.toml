[package]
name = "nif-tool"
version = "0.1.0"
edition = "2021"
description = "SSE NIF texture path rewriting tool (native rewrite of AutoMod's nif-tool)"
license = "MIT"
publish = false

[dependencies]
# Same clap as the Windows nif-tool, so help and usage-error text match.
clap = { version = "=4.5.58", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
